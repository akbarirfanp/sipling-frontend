name: CD - Build & Deploy

on:
  pull_request:
    branches:
      - dev-v2
    types: [closed]
  # Uncomment if you want manual deployment trigger
  # workflow_dispatch:

jobs:
  # Only run if PR was merged (not just closed)
  check-merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check if should deploy
        id: check
        run: echo "should-deploy=true" >> $GITHUB_OUTPUT

  build-and-push-image:
    needs: check-merged
    if: needs.check-merged.outputs.should-deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.SOLUTIF_GCR_JSONKEY }}'
      - name: Log in to Docker
        uses: docker/login-action@v3
        with:
          username: _json_key
          password: ${{ secrets.SOLUTIF_GCR_JSONKEY }}
          registry: asia-southeast2-docker.pkg.dev
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: asia-southeast2-docker.pkg.dev/solutif/solutifcx/solutif-crm-frontend-service:development-${{ github.sha }}

  package-and-release-helm:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Package Helm chart
        run: helm package charts/solutif-crm-frontend-service
      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: solutif-crm-frontend-service-*.tgz

  deploy:
    needs: package-and-release-helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.SOLUTIF_GKE_JSONKEY }}'
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Download Helm chart artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: ./chart
      - name: Deploy to Kubernetes
        env:
          KUBE_CONFIG_DATA: ${{ secrets.GKE_TENCENT_KUBECONFIG }}
        run: |
          echo "$KUBE_CONFIG_DATA" > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
          kubectl --insecure-skip-tls-verify get nodes
          helm upgrade --install solutif-crm-frontend-service ./chart/solutif-crm-frontend-service-*.tgz \
            --set image.repository=asia-southeast2-docker.pkg.dev/solutif/solutifcx/solutif-crm-frontend-service \
            --set image.tag=development-${{ github.sha }} \
            --kube-insecure-skip-tls-verify
